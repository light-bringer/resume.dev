version: '3.8'

services:
  # Backend API - Not exposed to host
  backend:
    container_name: resume-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    networks:
      - resume-network
    # Note: Healthcheck disabled for distroless (no shell/wget/curl)
    # Alternative: Use Docker's built-in HTTP healthcheck or external monitoring
    # For now, relying on startup order and network connectivity
    restart: unless-stopped

  # Frontend - Only this is exposed to host
  frontend:
    container_name: resume-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_URL=http://backend:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"  # Only frontend is exposed to host
    networks:
      - resume-network
    depends_on:
      backend:
        condition: service_started
    # Note: Healthcheck disabled for distroless (no shell/wget/curl)
    # depends_on ensures backend starts first, frontend will retry on connection errors
    restart: unless-stopped

networks:
  resume-network:
    driver: bridge
